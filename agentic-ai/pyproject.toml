[project]
name = "agentic-ai"
version = "0.1.0"
description = "AgriConnect Agentic AI Subsystem using LangChain and LangGraph"
readme = "README.md"
authors = [
    { name = "Pasan Wijekoon", email = "pasan.16109@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.20",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
agentic-ai = "src.app.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# This is a service run with uvicorn, not a library: install dependencies only.
# Without this, `uv sync` fails looking for src/agentic_ai/__init__.py.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
