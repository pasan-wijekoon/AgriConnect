name: Agentic AI - Build & Deploy (SnapDeploy)

on:
  pull_request:
    branches: [main]
    paths:
      - "agentic-ai/**"
      - "docker/agentic-ai/**"
      - ".github/workflows/agentic-ai-build-and-deploy.yaml"

  push:
    branches: [main]
    paths:
      - "agentic-ai/**"
      - "docker/agentic-ai/**"
      - ".github/workflows/agentic-ai-build-and-deploy.yaml"

  workflow_dispatch:

concurrency:
  group: agentic-ai-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: agriconnect-agentic-ai
  SNAPDEPLOY_API: https://snapdeploy.dev/api/mobile

jobs:

  # =========================================================
  # 1. TEST
  # =========================================================
  test:
    name: Install & Test (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: agentic-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agentic-ai/pyproject.toml

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Import check
        env:
          LLM_PROVIDER: gemini
          ENVIRONMENT: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -c "import src.app.main"

      - name: Run tests
        env:
          LLM_PROVIDER: gemini
          ENVIRONMENT: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INTERNAL_API_SECRET: ci-test-secret
        run: |
          if [ -d tests ] || find . -name 'test_*.py' -not -path './.venv/*' | grep -q .; then
            uv run pytest -q
          else
            echo "No tests found - skipping."
          fi

  # =========================================================
  # 2. VERIFY DOCKER IMAGE BUILDS (no push - SnapDeploy builds it)
  # =========================================================
  docker:
    name: Verify Docker Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agentic-ai/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=agentic-ai
          cache-to: type=gha,scope=agentic-ai,mode=max

  # =========================================================
  # 3. DEPLOY TO SNAPDEPLOY
  # =========================================================
  deploy:
    name: Deploy Agentic AI to SnapDeploy
    needs: docker

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production

    steps:
      - name: Check deployment secrets
        env:
          SNAPDEPLOY_AGENTIC_AI_API_KEY: ${{ secrets.SNAPDEPLOY_AGENTIC_AI_API_KEY }}
          SNAPDEPLOY_AGENTIC_AI_CONTAINER_NAME: ${{ secrets.SNAPDEPLOY_AGENTIC_AI_CONTAINER_NAME }}
        run: |
          for v in SNAPDEPLOY_AGENTIC_AI_API_KEY SNAPDEPLOY_AGENTIC_AI_CONTAINER_NAME; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set"
              exit 1
            fi
          done
          echo "All required secrets are configured."

      - name: Trigger SnapDeploy deployment
        id: trigger
        env:
          API_KEY: ${{ secrets.SNAPDEPLOY_AGENTIC_AI_API_KEY }}
          CONTAINER_NAME: ${{ secrets.SNAPDEPLOY_AGENTIC_AI_CONTAINER_NAME }}
        run: |
          echo "Deploying Agentic AI to SnapDeploy..."

          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "${SNAPDEPLOY_API}/deploy" \
            -H "X-API-Key: ${API_KEY}" \
            -H "Idempotency-Key: release-${GITHUB_SHA}" \
            -H "X-SnapDeploy-Client: mcp/ci" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                  --arg repo "${GITHUB_REPOSITORY}" \
                  --arg name "${CONTAINER_NAME}" \
                  '{repo:$repo, name:$name, branch:"main", size:"small"}')")

          cat response.json
          echo

          if [ "$HTTP_CODE" = "402" ] || [ "$HTTP_CODE" = "429" ]; then
            echo "::error::SnapDeploy plan limit reached (HTTP $HTTP_CODE). Free tier allows 10 deploys/day. Not retrying."
            exit 1
          fi

          if [ "${HTTP_CODE:0:1}" != "2" ]; then
            echo "::error::SnapDeploy deploy failed (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo "container_id=$(jq -r '.containerId // empty' response.json)" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$(jq -r '.deploymentId // empty' response.json)" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.url // empty' response.json)" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to finish
        env:
          API_KEY: ${{ secrets.SNAPDEPLOY_AGENTIC_AI_API_KEY }}
          CONTAINER_ID: ${{ steps.trigger.outputs.container_id }}
          DEPLOYMENT_ID: ${{ steps.trigger.outputs.deployment_id }}
        run: |
          if [ -z "$CONTAINER_ID" ]; then
            echo "No containerId returned - skipping status polling."
            exit 0
          fi

          for i in $(seq 1 40); do
            curl -sS "${SNAPDEPLOY_API}/containers/${CONTAINER_ID}/deployments" \
              -H "X-API-Key: ${API_KEY}" -o deployments.json

            STATUS=$(jq -r --arg id "$DEPLOYMENT_ID" '
              (if type=="array" then . else (.deployments // .content // []) end)
              | (map(select((.id|tostring)==$id or (.deploymentId|tostring)==$id)) + .)[0].status // "UNKNOWN"
            ' deployments.json)

            echo "[$i/40] Deployment status: $STATUS"

            if [ "$STATUS" = "COMPLETED" ]; then
              echo "Deployment completed."
              exit 0
            fi
            if [ "$STATUS" = "FAILED" ]; then
              echo "::error::SnapDeploy deployment FAILED. Check build logs in the SnapDeploy dashboard."
              exit 1
            fi
            sleep 15
          done

          echo "::error::Timed out waiting for deployment."
          exit 1

      - name: Deployment summary
        env:
          URL: ${{ steps.trigger.outputs.url }}
        run: |
          {
            echo "## Agentic AI Deployment"
            echo ""
            echo "**Platform:** SnapDeploy"
            echo "**LLM Provider:** Gemini"
            echo "**Container:** \`${{ secrets.SNAPDEPLOY_AGENTIC_AI_CONTAINER_NAME }}\`"
            echo "**URL:** ${URL:-n/a}"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "Deployment triggered successfully."
          } >> "$GITHUB_STEP_SUMMARY"
