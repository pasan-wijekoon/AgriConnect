name: Agentic AI - CI/CD

# Pipeline overview
#   test   : uv sync + import check + pytest, using the mock LLM (no secrets, safe for fork PRs)
#   docker : builds docker/agentic-ai/Dockerfile (every run); pushes to GHCR only on push to main
#   deploy : redeploys the Railway service (push to main only), then optional health check
#
# One-time setup
#   Settings > Environments > production  (add required reviewers if you want a manual gate)
#     Secrets:   RAILWAY_AGENTIC_AI_TOKEN
#                RAILWAY_AGENTIC_AI_PROJECT_ID
#                RAILWAY_AGENTIC_AI_SERVICE_ID
#   Settings > Secrets and variables > Actions > Variables (optional):
#                AGENTIC_AI_HEALTH_URL    e.g. https://<service>.up.railway.app/health
#
# Images are pushed as ghcr.io/<owner>/agriconnect-agentic-ai:sha-<commit> and :latest.
# Make sure the Railway service pulls this image (and has access to the package if it is private).

on:
  push:
    branches: [main, development, integration, test-oder]
    paths:
      - "agentic-ai/**"
      - "docker/agentic-ai/**"
      - ".github/workflows/agentic-ai-build-and-deploy.yaml"
  pull_request:
    branches: [main, development, integration]
    paths:
      - "agentic-ai/**"
      - "docker/agentic-ai/**"
      - ".github/workflows/agentic-ai-build-and-deploy.yaml"
  workflow_dispatch:

concurrency:
  group: agentic-ai-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  LLM_PROVIDER: mock
  CONTAINER_PORT: "8000"
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/agriconnect-agentic-ai

jobs:

  # =========================================================
  # 1. LINT + TEST (mock LLM, no network, no secrets)
  # =========================================================
  test:
    name: Lint & test (uv)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agentic-ai
    env:
      LLM_PROVIDER: mock
      TOOLS_MODE: mock
      ENVIRONMENT: test
      INTERNAL_API_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: agentic-ai/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (only if ruff is configured)
        run: |
          if grep -q "\[tool.ruff" pyproject.toml; then
            uv run --with ruff ruff check .
          else
            echo "No [tool.ruff] config in pyproject.toml - skipping lint."
          fi

      - name: Import check (app boots with mock provider)
        run: uv run python -c "import src.app.main"

      - name: Test
        run: |
          if [ -z "$(find . -path ./.venv -prune -o \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit)" ]; then
            echo "No tests found - skipping."
            exit 0
          fi
          # Long-term fix: `uv add --dev pytest pytest-asyncio`, commit
          # pyproject.toml + uv.lock, then use plain `uv run pytest -q`.
          uv run --with pytest --with pytest-asyncio pytest -q

  # =========================================================
  # 2. BUILD IMAGE, SMOKE TEST IT, THEN PUSH TO GHCR (main only)
  # =========================================================
  docker:
    name: Docker build, smoke test & publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    env:
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agentic-ai/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: agriconnect-agentic-ai:ci
          cache-from: type=gha,scope=agentic-ai
          cache-to: type=gha,scope=agentic-ai,mode=max

      # FastAPI always serves /openapi.json, so no custom health route is needed.
      - name: Smoke test container
        run: |
          docker run -d --name agent \
            -p ${{ env.CONTAINER_PORT }}:${{ env.CONTAINER_PORT }} \
            -e LLM_PROVIDER=mock \
            agriconnect-agentic-ai:ci

          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${{ env.CONTAINER_PORT }}/openapi.json" > /dev/null; then
              echo "Container is serving requests."
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become ready. Logs:"
          docker logs agent
          exit 1

      - name: Log in to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags & labels
        if: env.SHOULD_PUSH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Layers are cached from the build above, so this step is fast.
      - name: Push to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agentic-ai/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agentic-ai

  # =========================================================
  # 3. DEPLOY TO RAILWAY
  #    Pushing an image does not redeploy by itself, so we tell Railway
  #    to redeploy; it then pulls ghcr.io/<owner>/agriconnect-agentic-ai:latest.
  #    RAILWAY_TOKEN must be a PROJECT token (scoped to one environment).
  # =========================================================
  deploy:
    name: Deploy to Railway
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    concurrency:
      group: railway-deploy-agentic-ai
      cancel-in-progress: false

    steps:
      - name: Redeploy Railway service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE" ]; then
            echo "RAILWAY_TOKEN secret and RAILWAY_SERVICE variable are required."
            exit 1
          fi
          npx -y @railway/cli@latest redeploy --service "$RAILWAY_SERVICE" --yes

      - name: Summary
        run: |
          {
            echo "## Agentic AI deployed to Railway"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "Tests and smoke test passed, image published, Railway redeploy triggered."
            echo ""
            echo "Image:"
            echo "- \`${{ env.GHCR_IMAGE }}:latest\`"
            echo "- \`${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================
  # 4. HEALTH CHECK (skipped unless AGENT_HEALTH_URL is set)
  #    Skip it if the service has no public domain (private networking).
  # =========================================================
  verify:
    name: Health check
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Wait for service to respond
        env:
          HEALTH_URL: ${{ vars.AGENT_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "AGENT_HEALTH_URL not set - skipping."
            exit 0
          fi

          # Give Railway time to pull the image and swap containers.
          sleep 45

          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Service is healthy."
              exit 0
            fi
            sleep 20
          done

          echo "Service did not become healthy in time."
          exit 1
