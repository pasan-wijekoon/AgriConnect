name: Agentic AI - CI/CD 

# Push to main:
#   1. test    -> install deps, lint (if configured), run pytest with a MOCKED LLM
#   2. docker  -> build image, push to GHCR and Docker Hub
#   3. deploy  -> fast-forward the `deploy-agent` branch; Back4app watches it
#   4. verify  -> optional health check
# Pull requests run steps 1 and 2 only, and nothing is pushed.

on:
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "docker/agent/**"
      - ".github/workflows/agent-cicd.yaml"

  push:
    branches: [main]
    paths:
      - "agent/**"
      - "docker/agent/**"
      - ".github/workflows/agent-cicd.yaml"

  workflow_dispatch:

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/agent
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/agent

jobs:

  # =========================================================
  # 1. INSTALL, LINT, TEST
  #    Tests must not call the real LLM (slow, costly, flaky).
  #    A dummy key is passed so client libraries initialise.
  # =========================================================
  test:
    name: Lint & test (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: agent/requirements*.txt

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest ruff

      - name: Lint
        working-directory: agent
        run: ruff check .

      - name: Test (mocked LLM)
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: test-key-not-real
        run: |
          if [ -z "$(find . -name 'test_*.py' -o -name '*_test.py')" ]; then
            echo "No tests found - skipping."
            exit 0
          fi
          pytest -q

  # =========================================================
  # 2. BUILD IMAGE, PUSH TO GHCR + DOCKER HUB (main only)
  # =========================================================
  docker:
    name: Docker build & publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    env:
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.AGRICONNECT_PAT }}

      - name: Log in to Docker Hub
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

  # =========================================================
  # 3. DEPLOY TO BACK4APP
  #    Moves `deploy-agent` to this commit; Back4app builds from it.
  # =========================================================
  deploy:
    name: Deploy to Back4app
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write

    concurrency:
      group: back4app-deploy-agent
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote commit to deploy-agent branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "${{ github.sha }}:refs/heads/deploy-agent" --force

      - name: Summary
        run: |
          {
            echo "## Agent deployed"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "Tests passed, image published, \`deploy-agent\` branch updated."
            echo ""
            echo "Images:"
            echo "- \`${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}\`"
            echo "- \`${{ env.DOCKERHUB_IMAGE }}:sha-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================
  # 4. OPTIONAL HEALTH CHECK (skipped if AGENT_HEALTH_URL unset)
  # =========================================================
  verify:
    name: Health check
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Wait for service to respond
        env:
          HEALTH_URL: ${{ vars.AGENT_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "AGENT_HEALTH_URL not set - skipping."
            exit 0
          fi

          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Service is healthy."
              exit 0
            fi
            sleep 30
          done

          echo "Service did not become healthy in time."
          exit 1
