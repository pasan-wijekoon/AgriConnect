name: Agentic AI - Build & Deploy (SnapDeploy)

on:
  pull_request:
    branches: [main]
    paths:
      - "agentic-ai/**"
      - "docker/agentic-ai/**"
      - ".github/workflows/agentic-ai-build-and-deploy.yaml"

  push:
    branches: [main]
    paths:
      - "agentic-ai/**"
      - "docker/agentic-ai/**"
      - ".github/workflows/agentic-ai-build-and-deploy.yaml"

  workflow_dispatch:

concurrency:
  group: agentic-ai-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: agriconnect-agentic-ai
  SNAPDEPLOY_API: https://snapdeploy.dev/api/mobile

jobs:

  # =========================================================
  # 1. TEST
  # =========================================================
  test:
    name: Install & Test (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: agentic-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agentic-ai/pyproject.toml

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Import check
        env:
          LLM_PROVIDER: gemini
          ENVIRONMENT: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -c "import src.app.main"

      - name: Run tests
        env:
          LLM_PROVIDER: gemini
          ENVIRONMENT: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INTERNAL_API_SECRET: ci-test-secret
        run: |
          if [ -d tests ] || find . -name 'test_*.py' -not -path './.venv/*' | grep -q .; then
            uv run pytest -q
          else
            echo "No tests found - skipping."
          fi

  # =========================================================
  # 2. BUILD & PUSH DOCKER IMAGE TO GHCR
  # =========================================================
  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Docker image reference
        id: image
        shell: bash
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Docker image: ${IMAGE}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agentic-ai/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha,scope=agentic-ai
          cache-to: type=gha,scope=agentic-ai,mode=max

  # =========================================================
  # 3. DEPLOY TO SNAPDEPLOY (pulls image from GHCR)
  # =========================================================
  deploy:
    name: Deploy Agentic AI to SnapDeploy
    needs: docker

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production

    steps:
      - name: Check deployment secrets
        env:
          SNAPDEPLOY_AGENTIC_AI_API_KEY: ${{ secrets.SNAPDEPLOY_AGENTIC_AI_API_KEY }}
          SNAPDEPLOY_AGENTIC_AI_CONTAINER_ID: ${{ secrets.SNAPDEPLOY_AGENTIC_AI_CONTAINER_ID }}
        run: |
          for v in SNAPDEPLOY_AGENTIC_AI_API_KEY SNAPDEPLOY_AGENTIC_AI_CONTAINER_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set"
              exit 1
            fi
          done
          echo "All required secrets are configured."

      - name: Restart container to pull latest image
        env:
          API_KEY: ${{ secrets.SNAPDEPLOY_AGENTIC_AI_API_KEY }}
          CONTAINER_ID: ${{ secrets.SNAPDEPLOY_AGENTIC_AI_CONTAINER_ID }}
        run: |
          call() {
            # $1 = action (stop|start)
            CODE=$(curl -sS -o resp.json -w "%{http_code}" \
              -X POST "${SNAPDEPLOY_API}/containers/${CONTAINER_ID}/$1" \
              -H "X-API-Key: ${API_KEY}" \
              -H "X-SnapDeploy-Client: mcp/ci")
            echo "$1 -> HTTP $CODE"
            cat resp.json; echo
            if [ "$CODE" = "402" ] || [ "$CODE" = "429" ]; then
              echo "::error::SnapDeploy plan limit reached (HTTP $CODE). Not retrying."
              exit 1
            fi
            echo "$CODE"
          }

          echo "Pulling ${{ needs.docker.outputs.image }}:latest on SnapDeploy..."

          # Stop errors are tolerated (container may already be asleep/stopped).
          call stop > /dev/null || true
          sleep 5

          START_CODE=$(call start | tail -n 1)
          if [ "${START_CODE:0:1}" != "2" ]; then
            echo "::error::Failed to start container (HTTP $START_CODE)"
            exit 1
          fi
          echo "Container start requested."

      - name: Health check
        env:
          APP_URL: ${{ secrets.SNAPDEPLOY_AGENTIC_AI_URL }}
          HEALTH_PATH: /health
        run: |
          if [ -z "$APP_URL" ]; then
            echo "SNAPDEPLOY_AGENTIC_AI_URL not set - skipping health check."
            exit 0
          fi

          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" "${APP_URL%/}${HEALTH_PATH}" || echo 000)
            echo "[$i/30] ${APP_URL%/}${HEALTH_PATH} -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Service is healthy."
              exit 0
            fi
            sleep 10
          done

          echo "::error::Health check did not pass in time."
          exit 1

      - name: Deployment summary
        run: |
          {
            echo "## Agentic AI Deployment"
            echo ""
            echo "**Platform:** SnapDeploy (image from GHCR)"
            echo "**LLM Provider:** Gemini"
            echo "**Image:** \`${{ needs.docker.outputs.image }}:${{ github.sha }}\`"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "Deployment triggered successfully."
          } >> "$GITHUB_STEP_SUMMARY"
