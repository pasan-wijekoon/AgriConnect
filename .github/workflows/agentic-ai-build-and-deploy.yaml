name: Agentic AI - Build & Deploy (Northflank)

on:
  pull_request:
    branches: [main]
    paths:
      - "agentic-ai/**"
      - "docker/agentic-ai/**"
      - ".github/workflows/agentic-ai-build-and-deploy.yaml"

  push:
    branches: [main]
    paths:
      - "agentic-ai/**"
      - "docker/agentic-ai/**"
      - ".github/workflows/agentic-ai-build-and-deploy.yaml"

  workflow_dispatch:

concurrency:
  group: agentic-ai-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: agriconnect-agentic-ai

jobs:

  # =========================================================
  # 1. TEST
  # =========================================================
  test:
    name: Install & Test (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: agentic-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agentic-ai/pyproject.toml

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Import check
        env:
          LLM_PROVIDER: gemini
          ENVIRONMENT: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -c "import src.app.main"

      - name: Run tests
        env:
          LLM_PROVIDER: gemini
          ENVIRONMENT: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INTERNAL_API_SECRET: ci-test-secret
        run: |
          if [ -d tests ] || find . -name 'test_*.py' -not -path './.venv/*' | grep -q .; then
            uv run pytest -q
          else
            echo "No tests found - skipping."
          fi

  # =========================================================
  # 2. BUILD & PUSH DOCKER IMAGE TO GHCR
  # =========================================================
  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Docker image reference
        id: image
        shell: bash
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Docker image: ${IMAGE}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agentic-ai/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha,scope=agentic-ai
          cache-to: type=gha,scope=agentic-ai,mode=max

  # =========================================================
  # 3. DEPLOY TO NORTHFLANK
  # =========================================================
  deploy:
    name: Deploy Agentic AI to Northflank
    needs: docker

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production

    steps:
      - name: Check deployment secrets
        env:
          NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY }}
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID }}
          NORTHFLANK_SERVICE_ID: ${{ secrets.NORTHFLANK_SERVICE_ID }}
        run: |
          for v in NORTHFLANK_API_KEY NORTHFLANK_PROJECT_ID NORTHFLANK_SERVICE_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set"
              exit 1
            fi
          done
          echo "All required secrets are configured."

      - name: Deploy image to Northflank
        uses: northflank/deploy-to-northflank@v1
        with:
          northflank-api-key: ${{ secrets.NORTHFLANK_API_KEY }}
          project-id: ${{ secrets.NORTHFLANK_PROJECT_ID }}
          service-id: ${{ secrets.NORTHFLANK_SERVICE_ID }}
          image-path: ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}

      - name: Deployment summary
        run: |
          {
            echo "## Agentic AI Deployment"
            echo ""
            echo "**Platform:** Northflank"
            echo "**Image:** \`${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}\`"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "Deployment triggered successfully."
          } >> "$GITHUB_STEP_SUMMARY"
