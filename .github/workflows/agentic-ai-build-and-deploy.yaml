name: Agentic AI - CI/CD 

# AgriConnect agentic-ai service: Python 3.12, uv, FastAPI + LangGraph.
#
# Pull request : test -> build image + smoke test (nothing is pushed)
# Push to main : test -> build + smoke test + push to GHCR & Docker Hub
#                -> promote `deploy-agent` branch (Back4app builds from it)
#                -> health check
#
# No real LLM key is used in CI. The service ships with LLM_PROVIDER=mock,
# so tests and the container smoke test run deterministically and for free.

on:
  pull_request:
    branches: [main]
    paths:
      - "agentic-ai/**"
      - "docker/agentic-ai/**"
      - ".github/workflows/agentic-ai-cicd.yaml"

  push:
    branches: [main]
    paths:
      - "agentic-ai/**"
      - "docker/agentic-ai/**"
      - ".github/workflows/agentic-ai-cicd.yaml"

  workflow_dispatch:

concurrency:
  group: agentic-ai-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  LLM_PROVIDER: mock
  CONTAINER_PORT: "8000"
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/agriconnect-agentic-ai
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/agriconnect-agentic-ai

jobs:

  # =========================================================
  # 1. LINT + TEST (mock LLM, no network, no secrets)
  # =========================================================
  test:
    name: Lint & test (uv)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: agentic-ai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agentic-ai/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml,
      # so dependency drift is caught in CI instead of in production.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (only if ruff is configured)
        run: |
          if grep -q "\[tool.ruff" pyproject.toml; then
            uv run --with ruff ruff check .
          else
            echo "No [tool.ruff] config in pyproject.toml - skipping lint."
          fi

      - name: Import check (app boots with mock provider)
        run: uv run python -c "import src.app.main"

      - name: Test
        run: |
          if [ -z "$(find . -path ./.venv -prune -o \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit)" ]; then
            echo "No tests found - skipping."
            exit 0
          fi
          uv run --with pytest pytest -q

  # =========================================================
  # 2. BUILD IMAGE, SMOKE TEST IT, THEN PUSH (main only)
  # =========================================================
  docker:
    name: Docker build, smoke test & publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    env:
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build once and load it locally so we can run it before publishing.
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agentic-ai/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: agriconnect-agentic-ai:ci
          cache-from: type=gha,scope=agentic-ai
          cache-to: type=gha,scope=agentic-ai,mode=max

      # FastAPI always serves /openapi.json, so no custom health route is needed
      # to prove the container starts and the app imports inside the image.
      - name: Smoke test container
        run: |
          docker run -d --name agent \
            -p ${{ env.CONTAINER_PORT }}:${{ env.CONTAINER_PORT }} \
            -e LLM_PROVIDER=mock \
            agriconnect-agentic-ai:ci

          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${{ env.CONTAINER_PORT }}/openapi.json" > /dev/null; then
              echo "Container is serving requests."
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become ready. Logs:"
          docker logs agent
          exit 1

      - name: Log in to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags & labels
        if: env.SHOULD_PUSH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Layers are cached from the build above, so this step is fast.
      - name: Push to GHCR and Docker Hub
        if: env.SHOULD_PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agentic-ai/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agentic-ai

  # =========================================================
  # 3. DEPLOY TO BACK4APP
  #    Moves `deploy-agent` to this commit; Back4app watches that
  #    branch and builds + releases it.
  # =========================================================
  deploy:
    name: Deploy to Back4app
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write

    concurrency:
      group: back4app-deploy-agentic-ai
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote commit to deploy-agent branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "${{ github.sha }}:refs/heads/deploy-agent" --force

      - name: Summary
        run: |
          {
            echo "## Agentic AI deployed"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "Tests and container smoke test passed, images published, \`deploy-agent\` updated."
            echo ""
            echo "Images:"
            echo "- \`${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}\`"
            echo "- \`${{ env.DOCKERHUB_IMAGE }}:sha-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================
  # 4. HEALTH CHECK (skipped unless AGENT_HEALTH_URL is set)
  #    Use .../openapi.json if the service has no /health route.
  # =========================================================
  verify:
    name: Health check
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Wait for service to respond
        env:
          HEALTH_URL: ${{ vars.AGENT_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "AGENT_HEALTH_URL not set - skipping."
            exit 0
          fi

          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Service is healthy."
              exit 0
            fi
            sleep 30
          done

          echo "Service did not become healthy in time."
          exit 1
