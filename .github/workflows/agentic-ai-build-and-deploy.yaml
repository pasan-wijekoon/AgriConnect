name: Agentic AI - CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "agentic-ai/**"
      - "docker/agentic-ai/**"
      - ".github/workflows/agentic-ai-build-and-deploy.yaml"

  push:
    branches: [main]
    paths:
      - "agentic-ai/**"
      - "docker/agentic-ai/**"
      - ".github/workflows/agentic-ai-build-and-deploy.yaml"

  workflow_dispatch:

concurrency:
  group: agentic-ai-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# NOTE: keys here MUST be lowercase. `Packages: write` is silently ignored.
permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  LLM_PROVIDER: mock
  CONTAINER_PORT: "8000"
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/agriconnect-agentic-ai

jobs:

  # =========================================================
  # 1. LINT + TEST (mock LLM, no network, no secrets)
  # =========================================================
  test:
    name: Lint & test (uv)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: agentic-ai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agentic-ai/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (only if ruff is configured)
        run: |
          if grep -q "\[tool.ruff" pyproject.toml; then
            uv run --with ruff ruff check .
          else
            echo "No [tool.ruff] config in pyproject.toml - skipping lint."
          fi

      - name: Import check (app boots with mock provider)
        run: uv run python -c "import src.app.main"

      - name: Test
        run: |
          if [ -z "$(find . -path ./.venv -prune -o \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit)" ]; then
            echo "No tests found - skipping."
            exit 0
          fi
          uv run --with pytest --with pytest-asyncio pytest -q

  # =========================================================
  # 2. BUILD IMAGE, SMOKE TEST IT, THEN PUSH TO GHCR (main only)
  # =========================================================
  docker:
    name: Docker build, smoke test & publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Explicit at job level too, in case the top-level block is ever changed.
    permissions:
      contents: read
      packages: write

    env:
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agentic-ai/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: agriconnect-agentic-ai:ci
          cache-from: type=gha,scope=agentic-ai
          cache-to: type=gha,scope=agentic-ai,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name agent \
            -p ${{ env.CONTAINER_PORT }}:${{ env.CONTAINER_PORT }} \
            -e LLM_PROVIDER=mock \
            agriconnect-agentic-ai:ci

          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:${{ env.CONTAINER_PORT }}/health" > /dev/null; then
              echo "Container is serving /health."
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become ready. Logs:"
          docker logs agent
          exit 1

      - name: Log in to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags & labels
        if: env.SHOULD_PUSH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Push to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agentic-ai/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agentic-ai

      - name: Compute deployable image reference
        id: ref
        run: |
          image="$(echo "${GHCR_IMAGE}" | tr '[:upper:]' '[:lower:]'):sha-${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  # =========================================================
  # 3. DEPLOY TO AWS EC2 over SSH
  # =========================================================
  deploy:
    name: Deploy to AWS
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: aws-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
          IMAGE: ${{ needs.docker.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'mock' }}
          DEFAULT_MODEL: ${{ vars.DEFAULT_MODEL || 'gemini-2.5-flash' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          {
            for v in IMAGE GHCR_USER GHCR_TOKEN INTERNAL_API_SECRET LLM_PROVIDER DEFAULT_MODEL GEMINI_API_KEY; do
              printf 'export %s=%q\n' "$v" "${!v:-}"
            done
            cat <<'REMOTE'
          set -euo pipefail
          if ! command -v docker >/dev/null; then
            dnf install -y docker
            systemctl enable --now docker
          fi
          if ! swapon --show | grep -q .; then
            fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile >/dev/null && swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          docker network inspect agriconnect >/dev/null 2>&1 || docker network create agriconnect >/dev/null
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          docker pull "$IMAGE"
          PREV="$(docker inspect -f '{{.Config.Image}}' agentic-ai 2>/dev/null || true)"

          start() {
            docker rm -f agentic-ai >/dev/null 2>&1 || true
            docker run -d --name agentic-ai --network agriconnect --restart unless-stopped --memory 768m \
              -e HOST=0.0.0.0 -e PORT=8000 -e ENVIRONMENT=production -e TOOLS_MODE=mock \
              -e BACKEND_API_BASE_URL=http://backend:5000 \
              -e LLM_PROVIDER -e DEFAULT_MODEL -e GEMINI_API_KEY -e INTERNAL_API_SECRET \
              "$1" >/dev/null
          }
          healthy() {
            for _ in $(seq 1 45); do
              docker exec agentic-ai curl -fsS http://localhost:8000/health >/dev/null 2>&1 </dev/null && return 0
              sleep 2
            done
            return 1
          }

          start "$IMAGE"
          if healthy; then
            echo "agentic-ai is healthy on $IMAGE"
            docker logout ghcr.io >/dev/null 2>&1 || true
            docker image prune -af --filter "until=168h" >/dev/null 2>&1 || true
            exit 0
          fi
          echo "agentic-ai did NOT become healthy. Last logs:" >&2
          docker logs --tail 60 agentic-ai >&2 || true
          if [ -n "$PREV" ] && [ "$PREV" != "$IMAGE" ]; then echo "Rolling back to $PREV" >&2; start "$PREV" || true; fi
          exit 1
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$EC2_USER@$EC2_HOST" 'sudo bash -s'

      - name: Show service URL
        run: |
          echo "Agentic AI (private) : http://agentic-ai:8000"
          {
            echo "## Agentic AI deployed to AWS"
            echo ""
            echo "| Service | URL |"
            echo "|---|---|"
            echo "| Agentic AI (private) | \`http://agentic-ai:8000\` |"
            echo ""
            echo "This service is **deliberately not public**. It has no internet address; the backend reaches it at the URL above on the server's private Docker network."
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "Image: \`${{ needs.docker.outputs.image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
