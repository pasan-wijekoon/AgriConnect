name: Android - CI/CD



on:
  push:
    branches: [main, development, integration, test-oder]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yaml"
      
  pull_request:
    branches: [main, development, integration]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yaml"
      
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ================================================================
  # CI — analyze + test
  # ================================================================
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (runs only if tests exist)
        run: |
          if [ -d test ] && find test -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No tests found - skipping."
          fi

  # ================================================================
  # Build — signed release APK + AAB
  # ================================================================
  build:
    name: Build signed release (APK + AAB)
    needs: verify
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    env:
      ANDROID_DIR: android
      KEYSTORE_FILE: upload-keystore.jks
      KEY_PROPS: android/key.properties

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      # ----------------------------------------------------------
      # 1. Delete android/ and regenerate fresh from pubspec.
      #    Guarantees a clean, reproducible Android project
      # ----------------------------------------------------------
      - name: Regenerate android/ fresh
        run: |
          rm -rf "$ANDROID_DIR"
          flutter create \
            --platforms=android \
            --org com.agriconnect \
            --project-name agriconnect \
            .
          ls -la "$ANDROID_DIR"

      # ----------------------------------------------------------
      # 2. Set build number in local.properties.
      # ----------------------------------------------------------
      - name: Set build number
        run: |
          if [ ! -f android/local.properties ]; then
            echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          fi
          echo "flutter.versionCode=${{ github.run_number }}" >> android/local.properties

      # ----------------------------------------------------------
      # 3. Restore keystore from base64 secret.
      # ----------------------------------------------------------
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_DIR/$KEYSTORE_FILE"
          echo "Keystore restored:"
          ls -lh "$ANDROID_DIR/$KEYSTORE_FILE"

      # ----------------------------------------------------------
      # 4. Create key.properties from secrets.
      # ----------------------------------------------------------
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::One or more keystore secrets are missing."
            exit 1
          fi
          cat > "$KEY_PROPS" <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_FILE
          EOF
          echo "key.properties created:"
          sed 's/Password=.*/Password=***/' "$KEY_PROPS"

      # ----------------------------------------------------------
      # 5. Patch build.gradle.kts with release signing config.
      #    Freshly-generated Flutter projects only have a "debug"
      #    signingConfig on the release build type — we swap it.
      # ----------------------------------------------------------
      - name: Patch build.gradle.kts
        run: |
          FILE="android/app/build.gradle.kts"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE not found. Aborting."
            exit 1
          fi

          python3 - <<'PY'
          import re, pathlib

          path = pathlib.Path("android/app/build.gradle.kts")
          src = path.read_text()

          # (a) Load key.properties at top of file
          loader = '''import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          '''
          if "keystoreProperties" not in src:
              src = loader + "\n\n" + src

          # (b) Insert signingConfigs block into android { }
          signing_block = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
          if "signingConfigs" not in src:
              src = re.sub(r"(android\s*\{)", r"\1" + signing_block, src, count=1)

          # (c) Point release buildType at the release signingConfig
          src = re.sub(
              r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
              'signingConfig = signingConfigs.getByName("release")',
              src,
          )

          path.write_text(src)
          print("✓ Patched build.gradle.kts")
          PY

          echo "----- signing section -----"
          grep -A 10 -E "signingConfigs|buildTypes" android/app/build.gradle.kts || true

      # ----------------------------------------------------------
      # 6. Build signed release AAB + APK.
      # ----------------------------------------------------------
      - name: Build signed release AAB
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          DART_DEFINES=$(printf 'API_BASE_URL=%s' "$API_BASE_URL" | base64 -w0)
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -Pdart-defines="$DART_DEFINES"

      - name: Build signed release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          DART_DEFINES=$(printf 'API_BASE_URL=%s' "$API_BASE_URL" | base64 -w0)
          cd android
          ./gradlew assembleRelease --no-daemon -Pdart-defines="$DART_DEFINES"

      # ----------------------------------------------------------
      # 7. Verify APK signature.
      # ----------------------------------------------------------
      - name: Verify APK signature
        run: |
          APK=$(find build/app/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Verifying: $APK"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      # ----------------------------------------------------------
      # 8. Upload artifacts.
      # ----------------------------------------------------------
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: agriconnect-release-aab-${{ github.ref_name }}
          path: mobile/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: agriconnect-release-apk-${{ github.ref_name }}
          path: mobile/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------------
      # 9. Cleanup secrets from the runner.
      # ----------------------------------------------------------
      - name: Cleanup keystore
        if: always()
        run: |
          rm -f "android/$KEYSTORE_FILE" "$KEY_PROPS"
