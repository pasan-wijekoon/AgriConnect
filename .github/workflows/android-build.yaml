# Flutter mobile app - analyze, test and build a release APK (downloadable from the run's artifacts).
name: Android build and test

on:
  push:
    branches: [main, development, integration, test-oder]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yaml'
  pull_request:
    branches: [main, development, integration]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yaml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        # Only errors fail the job: the project still has info-level deprecation notices and one
        # unused-element warning (create_listing_screen.dart).
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agriconnect-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
