name: Android - CI/CD

# Flutter analyze + test on PRs; on push to main/development/integration/test-oder
# (and v* tags), build a debug APK via Gradle (assembleDebug).
#
# NOTE: Signed release builds (assembleRelease) are disabled for now. No signing
# secrets are needed while this workflow builds debug APKs.
#
# Optional repo variable (Settings > Secrets and variables > Actions > Variables):
#   API_BASE_URL

on:
  push:
    branches: [main, development, integration, test-oder]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yaml"
  pull_request:
    branches: [main, development, integration]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yaml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- CI
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        # Only errors fail the job: the project still has info-level deprecation notices and
        # one unused-element warning (create_listing_screen.dart). Remove the flags once cleaned up.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (runs only if tests exist)
        run: |
          if [ -d test ] && find test -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No tests found - skipping."
          fi

  # ---------------------------------------------------------------- Build: debug APK
  build:
    name: Build debug APK (assembleDebug)
    needs: verify
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get   # also generates android/local.properties (flutter.sdk)

      - name: Set build number
        run: echo "flutter.versionCode=${{ github.run_number }}" >> android/local.properties

      - name: Assemble debug APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          DART_DEFINES=$(printf 'API_BASE_URL=%s' "$API_BASE_URL" | base64 -w0)
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            -Pdart-defines="$DART_DEFINES"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agriconnect-debug-apk-${{ github.ref_name }}
          path: mobile/build/app/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14