name: Android - Build

# Flutter analyze + test on PRs; on push to main, build a signed release APK
# via Gradle (assembleRelease).
#
# Secrets (repo Settings > Secrets and variables > Actions, `production` environment):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, API_BASE_URL
#
# Assumes mobile/android/app/build.gradle(.kts) reads signing config from android/key.properties.

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yaml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yaml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (runs only if tests exist)
        run: |
          if [ -d test ] && find test -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No tests found - skipping."
          fi

  build:
    name: Build signed release APK (assembleRelease)
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD API_BASE_URL; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is not set"; exit 1; fi
          done

      - name: Restore keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "storeFile=release.jks"
          } > android/key.properties

      - name: Get packages
        run: flutter pub get   # also generates android/local.properties (flutter.sdk)

      - name: Set build number
        run: echo "flutter.versionCode=${{ github.run_number }}" >> android/local.properties

      - name: Assemble release APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          DART_DEFINES=$(printf 'API_BASE_URL=%s' "$API_BASE_URL" | base64 -w0)
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease \
            --no-daemon \
            -Pdart-defines="$DART_DEFINES"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agriconnect-release-apk
          path: mobile/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing files
        if: always()
        run: rm -f android/app/release.jks android/key.properties
