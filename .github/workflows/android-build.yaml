name: Android - CI/CD

# Pipeline overview
#   verify   : flutter analyze + test          (every PR and every push)
#   preview  : unsigned debug APK              (push to development / integration / test-oder)
#   release  : signed release APK              (push to main, or a v* tag; `production` environment)
#   publish  : GitHub Release with the APK     (v* tags only)
#
# One-time setup
#   Settings > Secrets and variables > Actions
#     Variable (repository):  API_BASE_URL            -> backend URL for preview builds
#   Settings > Environments > production  (add required reviewers if you want a manual gate)
#     Secrets:  ANDROID_KEYSTORE_BASE64   (base64 -w0 release.jks)
#               ANDROID_KEYSTORE_PASSWORD
#               ANDROID_KEY_ALIAS
#               ANDROID_KEY_PASSWORD
#               API_BASE_URL              -> production backend URL
#
# Assumes mobile/android/app/build.gradle(.kts) reads signing config from android/key.properties
# (standard Flutter release-signing setup).

on:
  push:
    branches: [main, development, integration, test-oder]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yaml"
  pull_request:
    branches: [main, development, integration]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yaml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- CI
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        # Only errors fail the job: the project still has info-level deprecation notices and
        # one unused-element warning (create_listing_screen.dart). Remove the flags once cleaned up.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (runs only if tests exist)
        run: |
          if [ -d test ] && find test -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No tests found - skipping."
          fi

  # ---------------------------------------------------------------- CD: preview
  preview:
    name: Preview APK (unsigned)
    needs: verify
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/development' ||
       github.ref == 'refs/heads/integration' ||
       github.ref == 'refs/heads/test-oder')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build debug APK
        # Debug build so it works without signing secrets.
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          flutter build apk --debug \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agriconnect-preview-apk-${{ github.ref_name }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- CD: release
  release:
    name: Signed release APK
    needs: verify
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD API_BASE_URL; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is not set"; exit 1; fi
          done

      - name: Restore keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "storeFile=release.jks"
          } > android/key.properties

      - name: Get packages
        run: flutter pub get

      - name: Build signed APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          flutter build apk --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agriconnect-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing files
        if: always()
        run: rm -f android/app/release.jks android/key.properties

  # ---------------------------------------------------------------- CD: publish
  publish:
    name: Publish GitHub Release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: agriconnect-release-apk
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true