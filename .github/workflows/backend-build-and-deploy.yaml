name: Backend CI/CD

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker/backend/**"
      - ".github/workflows/backend-build-and-deploy.yaml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/backend/**"
      - ".github/workflows/backend-build-and-deploy.yaml"

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  test:
    name: Build and test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore backend/backend.csproj

      - name: Build
        run: dotnet build backend/backend.csproj --configuration Release --no-restore

      - name: Test
        run: |
          test_projects=$(find . -type f -iname '*tests*.csproj' -not -path './**/bin/*' -not -path './**/obj/*')
          if [ -n "$test_projects" ]; then
            dotnet test $test_projects --configuration Release --no-restore --no-build
          else
            echo "No test project is currently present; build verification completed."
          fi

  deploy:
    name: Deploy to Railway
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Railway CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          docker run --rm \
            -e RAILWAY_TOKEN \
            -e RAILWAY_PROJECT_ID \
            -e RAILWAY_SERVICE_ID \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/railwayapp/cli:latest \
            up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --ci
