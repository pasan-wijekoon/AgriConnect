# Backend (ASP.NET Core) - restore, build, apply EF Core migrations to a throw-away PostgreSQL
# and run backend.Tests (unit, concurrency and API tests).
# Deployment itself is done by Render's Git integration (render.yaml); this workflow only
# decides whether a push or pull request is healthy.
name: Backend build and test

on:
  push:
    branches: [main, development, integration, test-oder]
    paths:
      - 'backend/**'
      - 'backend.Tests/**'
      - '.github/workflows/backend-build-and-deploy.yaml'
  pull_request:
    branches: [main, development, integration]
    paths:
      - 'backend/**'
      - 'backend.Tests/**'
      - '.github/workflows/backend-build-and-deploy.yaml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agriconnect
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agriconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Read by the API host, by `dotnet ef` and by backend.Tests (TestDatabase.cs).
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=agriconnect;Username=postgres;Password=postgres
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend.Tests/backend.Tests.csproj

      - name: Build
        run: dotnet build backend.Tests/backend.Tests.csproj --configuration Release --no-restore

      - name: Apply EF Core migrations to the test database
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet ef database update --configuration Release

      - name: Run tests
        run: >-
          dotnet test backend.Tests/backend.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: TestResults/*.trx
          if-no-files-found: warn
