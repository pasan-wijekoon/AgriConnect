name: Backend - CI/CD

# AgriConnect backend: ASP.NET Core (.NET 10).
#
# Pull request : build + test -> build image (nothing is pushed)
# Push to main : build + test -> build + push to GHCR
#                -> redeploy the Railway service (it pulls the new image)
#                -> health check

on:
  pull_request:    branches: [main]
    paths:
      - "backend/**"
      - "docker/backend/**"
      - ".github/workflows/backend-build-and-deploy.yaml"

  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/backend/**"
      - ".github/workflows/backend-build-and-deploy.yaml"

  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.302"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/agriconnect-backend

jobs:

  # =========================================================
  # 1. BUILD & TEST
  # =========================================================
  build-test:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/backend.csproj

      - name: Build
        run: dotnet build backend/backend.csproj -c Release --no-restore

      - name: Test
        env:
          ConnectionStrings__Default: ${{ secrets.SUPABASE_CONNECTION_STRING }}
        run: |
          mapfile -t projects < <(find backend -name '*Tests.csproj')

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No test projects found - skipping."
            exit 0
          fi

          for p in "${projects[@]}"; do
            dotnet test "$p" -c Release
          done

  # =========================================================
  # 2. BUILD IMAGE (PRs) / BUILD + PUSH TO GHCR (main)
  # =========================================================
  docker:
    name: Docker build & publish
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # required to push to GHCR

    env:
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.AgriConnect_PAT }}

      - name: Generate tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # =========================================================
  # 3. DEPLOY TO RAILWAY
  #    Pushing an image does not redeploy by itself, so we tell Railway
  #    to redeploy; it then pulls ghcr.io/<owner>/agriconnect-backend:latest.
  #    RAILWAY_TOKEN must be a PROJECT token (scoped to one environment).
  # =========================================================
  deploy:
    name: Deploy to Railway
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    concurrency:
      group: railway-deploy-backend
      cancel-in-progress: false

    steps:
      - name: Redeploy Railway service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_BACKEND_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE" ]; then
            echo "RAILWAY_TOKEN secret and RAILWAY_BACKEND_SERVICE variable are required."
            exit 1
          fi
          npx -y @railway/cli@latest redeploy --service "$RAILWAY_SERVICE" --yes

      - name: Summary
        run: |
          {
            echo "## Backend deployed to Railway"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "Tests passed, image published, Railway redeploy triggered."
            echo ""
            echo "Image:"
            echo "- \`${{ env.GHCR_IMAGE }}:latest\`"
            echo "- \`${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================
  # 4. HEALTH CHECK (skipped unless BACKEND_HEALTH_URL is set)
  # =========================================================
  verify:
    name: Health check
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Wait for service to respond
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "BACKEND_HEALTH_URL not set - skipping."
            exit 0
          fi

          # Give Railway time to pull the image and swap containers.
          sleep 45

          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Service is healthy."
              exit 0
            fi
            sleep 20
          done

          echo "Service did not become healthy in time."
          exit 1
