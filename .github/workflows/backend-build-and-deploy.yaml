name: Backend - CI & Publish (GHCR + Docker Hub)

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/backend/**"
      - ".github/workflows/backend-ci-back4app.yaml"

  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/backend/**"
      - ".github/workflows/backend-ci-back4app.yaml"

  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.302"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  IMAGE_NAME: backend            # change to your image/repo name
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/backend
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/backend

jobs:

  # =========================================================
  # 1. BUILD & TEST
  # =========================================================
  build-test:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/backend.csproj

      - name: Build
        run: dotnet build backend/backend.csproj -c Release --no-restore

      - name: Test
        env:
          ConnectionStrings__Default: ${{ secrets.SUPABASE_CONNECTION_STRING }}
        run: |
          mapfile -t projects < <(find backend -name '*Tests.csproj')

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No test projects found - skipping."
            exit 0
          fi

          for p in "${projects[@]}"; do
            dotnet test "$p" -c Release
          done

  # =========================================================
  # 2. BUILD IMAGE (PRs) / BUILD + PUSH TO GHCR & DOCKER HUB (main)
  # =========================================================
  docker:
    name: Docker build & publish
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write          # required to push to GHCR

    env:
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # =========================================================
  # 3. SUMMARY
  # =========================================================
  summary:
    name: Deployment note
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Write summary
        run: |
          {
            echo "## Backend CI passed"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "Image published to:"
            echo "- \`${{ env.GHCR_IMAGE }}:latest\`"
            echo "- \`${{ env.DOCKERHUB_IMAGE }}:latest\`"
            echo "- Both also tagged \`sha-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
