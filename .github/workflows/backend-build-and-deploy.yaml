# Backend CI/CD: test, publish an immutable GHCR image, and deploy it to Render.
name: Backend CI/CD

on:
  push:
    branches: [main, development, integration]
    paths: ['backend/**', 'backend.Tests/**', 'docker/backend/**', '*.sln', 'Directory.Build.props', 'Directory.Packages.props', 'global.json', '.config/dotnet-tools.json', '.github/workflows/backend-build-and-deploy.yaml']
  pull_request:
    branches: [main, development, integration]
    paths: ['backend/**', 'backend.Tests/**', 'docker/backend/**', '*.sln', 'Directory.Build.props', 'Directory.Packages.props', 'global.json', '.config/dotnet-tools.json', '.github/workflows/backend-build-and-deploy.yaml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  IMAGE: ghcr.io/pasan-wijekoon/agriconnect-backend
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  test:
    name: Build and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agriconnect
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d agriconnect"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=agriconnect;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore backend.Tests/backend.Tests.csproj
      - name: Build Release
        run: dotnet build backend.Tests/backend.Tests.csproj -c Release --no-restore
      - name: Apply EF Core migrations
        working-directory: backend
        run: dotnet tool restore; dotnet ef database update -c Release --no-build
      - name: Run tests
        run: dotnet test backend.Tests/backend.Tests.csproj -c Release --no-build --logger "trx;LogFileName=backend-tests.trx" --results-directory TestResults
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: TestResults/*.trx
          if-no-files-found: warn

  image:
    name: Build and publish backend image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend to Render
    needs: image
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Verify Agentic AI dependency
        env:
          URL: ${{ vars.AGENTIC_AI_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then echo "Agentic AI health URL not configured; skipping check."; exit 0; fi
          for i in $(seq 1 40); do
            if curl --fail --silent --max-time 20 "$URL" > /dev/null; then exit 0; fi
            sleep 15
          done
          echo "::error::Agentic AI dependency is unavailable"
          exit 1
      - name: Trigger Render image deploy
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
          IMAGE: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
        run: |
          test -n "$HOOK" || { echo "::error::Render backend deploy hook is missing"; exit 1; }
          ENCODED_IMAGE=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["IMAGE"], safe=""))')
          curl --fail --silent --show-error --request POST "${HOOK}&imgURL=${ENCODED_IMAGE}"
      - name: Wait for backend health endpoint
        env:
          URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          test -n "$URL" || { echo "::error::BACKEND_HEALTH_URL is missing"; exit 1; }
          for i in $(seq 1 40); do
            if curl --fail --silent --max-time 20 "$URL" > /dev/null; then exit 0; fi
            sleep 15
          done
          echo "::error::Backend health check failed"
          exit 1
