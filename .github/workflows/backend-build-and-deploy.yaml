name: Backend - CI (Back4app Containers deploys from GitHub)

# Back4app Containers builds and deploys from your GitHub repo using its own
# GitHub App, so this workflow only has to prove the code and Dockerfile are
# good BEFORE (or as) a push reaches main. No image push, no deploy secrets.

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/backend/**"
      - ".github/workflows/backend-ci-back4app.yaml"

  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/backend/**"
      - ".github/workflows/backend-ci-back4app.yaml"

  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.302"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:

  # =========================================================
  # 1. BUILD & TEST
  # =========================================================
  build-test:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/backend.csproj

      - name: Build
        run: dotnet build backend/backend.csproj -c Release --no-restore

      - name: Test
        env:
          ConnectionStrings__Default: ${{ secrets.SUPABASE_CONNECTION_STRING }}
        run: |
          mapfile -t projects < <(find backend -name '*Tests.csproj')

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No test projects found - skipping."
            exit 0
          fi

          for p in "${projects[@]}"; do
            dotnet test "$p" -c Release
          done

  # =========================================================
  # 2. VERIFY DOCKER IMAGE BUILDS (same Dockerfile Back4app will build)
  # =========================================================
  docker-build-check:
    name: Verify Docker build (no push)
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # =========================================================
  # 3. SUMMARY
  # =========================================================
  summary:
    name: Deployment note
    needs: docker-build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Write summary
        run: |
          {
            echo "## Backend CI passed"
            echo ""
            echo "**Platform:** Back4app Containers (builds from GitHub on push)"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "Tests and Docker build succeeded. Back4app builds and deploys this commit from the repo automatically."
          } >> "$GITHUB_STEP_SUMMARY"
