# React web app - install, type-check, lint, build and run the web helper tests.
# Deployment itself is done by Vercel's Git integration (web/vercel.json).
name: Frontend build and test

on:
  push:
    branches: [main, development, integration, test-oder]
    paths:
      - 'web/**'
      - '.github/workflows/frontend-build-and-deploy.yaml'
  pull_request:
    branches: [main, development, integration]
    paths:
      - 'web/**'
      - '.github/workflows/frontend-build-and-deploy.yaml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000

      - name: Run web helper tests
        run: npm test

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: warn
